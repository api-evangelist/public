aid: public
name: Public
description: >-
  Public (Public Holdings, Inc.) is a multi-asset investing platform where people
  can trade stocks, ETFs, options, index options, crypto, bonds, and treasuries,
  and hold IRAs, direct indexing, high-yield cash, and margin in one account.
  Public positions itself as an "agentic brokerage" and ships a public Trading API
  (api.public.com) that lets developers programmatically manage accounts, pull
  market data, and place equity, crypto, and options orders with commission-free
  execution and options rebates. It also operates a hosted, OAuth-secured MCP
  server (mcp.public.com) so AI assistants like Claude and ChatGPT can query
  portfolios and trade on a user's behalf, alongside an official Python SDK,
  command-line interface, and Postman collection. Backed by Accel.
